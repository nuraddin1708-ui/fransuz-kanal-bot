name: Kanalga avtomatik post

on:
  schedule:
    # Toshkent vaqti = UTC + 5. Ish 30 daqiqa oldin boshlanadi (tayyorlash + 10 daqiqalik ogohlantirish).
    - cron: "30 3 * * *"    # 08:30 → 09:00 matn + audio
    - cron: "30 8 * * *"    # 13:30 → 14:00 rasmli post
    - cron: "30 12 * * *"   # 17:30 → 18:00 video
  workflow_dispatch:
    inputs:
      slot:
        description: "Qaysi post: morning (matn+audio), noon (rasm), evening (video), characters (pozalar), demo (namunaviy video)"
        required: true
        default: "morning"
        type: choice
        options: [morning, noon, evening, characters, demo]
      test:
        description: "Sinov: faqat menga (adminga) yuborilsin, kanalga emas"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: kanal-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kerakli dasturlarni o'rnatish
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 300 apt-get update -qq || true
          sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements.txt
          # Namunadagi kabi ensiz qalin shrift (Oswald, OFL litsenziya). Yuklanmasa, zaxira shrift ishlaydi.
          mkdir -p assets/fonts
          curl -sSfL -m 30 -o assets/fonts/Oswald.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf" || true

      - name: 6 agentni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          CHANNEL_TAG: ${{ vars.CHANNEL_TAG }}
          VOICE_SHOHISTA: ${{ vars.VOICE_SHOHISTA }}
          VOICE_CLAIRE: ${{ vars.VOICE_CLAIRE }}
          UNIQUE_POSES: ${{ vars.UNIQUE_POSES }}
          SLOT: ${{ github.event.inputs.slot }}
          TEST: ${{ github.event.inputs.test }}
        run: python main.py

      - name: Mavzular tarixi va xatolik hisobotini saqlash
        if: always()
        run: |
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add data/ assets/characters/ 2>/dev/null || git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Mavzular tarixi yangilandi"
          # Boshqa ishga tushirish shu orada yozgan bo'lsa — bizning fayllarimiz ustun, 3 marta urinadi
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1


      - name: Namunaviy videoni «demo-video» shoxobchasiga saqlash
        if: github.event.inputs.slot == 'demo' && success()
        run: |
          cd demo && git init -q -b demo-video && git add video.mp4 \
            && git -c user.name=kanal-bot -c user.email=kanal-bot@users.noreply.github.com commit -qm demo \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-video
